<!doctype html>
<meta charset="utf-8">
<title>Mask compare</title>
<style>body{margin:8px;background:#111;color:#bbb;font:12px system-ui} .row{display:flex;gap:6px;margin-bottom:6px} canvas{width:420px;height:auto;display:block}</style>
<div id="log">loading…</div><div id="out"></div>
<script src="/node_modules/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script type="module">
import { FilesetResolver, ImageSegmenter } from '/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs';
const log = (m) => (document.getElementById('log').textContent = m);
const imgs = [1, 2, 3, 4, 5, 6].map((i) => `img${i}.png`);
const load = (src) => new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.src = src; });

const old = new SelfieSegmentation({ locateFile: (f) => '/node_modules/@mediapipe/selfie_segmentation/' + f });
old.setOptions({ modelSelection: 1 });
let oldMask; old.onResults((r) => (oldMask = r.segmentationMask));
await old.initialize();

const fileset = await FilesetResolver.forVisionTasks('/node_modules/@mediapipe/tasks-vision/wasm');
const nu = await ImageSegmenter.createFromOptions(fileset, {
  baseOptions: { modelAssetPath: '/models/selfie_multiclass_256x256.tflite', delegate: 'CPU' },
  runningMode: 'IMAGE', outputConfidenceMasks: true, outputCategoryMask: false,
});

function overlay(img, probAt, thr, label) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height); let n = 0;
  for (let i = 0; i < c.width * c.height; i++) if (probAt(i) > thr) { n++; d.data[i * 4] = 255; d.data[i * 4 + 1] *= 0.35; d.data[i * 4 + 2] *= 0.35; }
  x.putImageData(d, 0, 0); x.fillStyle = '#fff'; x.fillText(`${label} ${(100 * n / (c.width * c.height)).toFixed(1)}%`, 6, 14);
  return c;
}
const out = document.getElementById('out');
const times = { old: [], nu: [] };
for (const src of imgs) {
  const img = await load(src);
  let t = performance.now(); await old.send({ image: img }); times.old.push(performance.now() - t);
  const m = document.createElement('canvas'); m.width = img.width; m.height = img.height;
  const mx = m.getContext('2d', { willReadFrequently: true }); mx.drawImage(oldMask, 0, 0, m.width, m.height);
  const od = mx.getImageData(0, 0, m.width, m.height).data;
  t = performance.now(); const res = nu.segment(img); times.nu.push(performance.now() - t);
  const bg = res.confidenceMasks[0].getAsFloat32Array(); // class 0 = background
  const row = document.createElement('div'); row.className = 'row';
  row.append(img.cloneNode ? Object.assign(document.createElement('canvas'), {}) : '');
  row.innerHTML = ''; 
  const orig = document.createElement('canvas'); orig.width = img.width; orig.height = img.height; orig.getContext('2d').drawImage(img, 0, 0);
  row.append(orig,
    overlay(img, (i) => od[i * 4] / 255, 80 / 255, 'old (threshold 80)'),
    overlay(img, (i) => 1 - bg[i], 0.3, 'new multiclass (person>0.3)'));
  out.append(row);
}
const avg = (a) => (a.reduce((s, v) => s + v, 0) / a.length).toFixed(1);
log(`done. avg ms: old ${avg(times.old)}  new ${avg(times.nu)} (CPU delegate, first-run included)`);
document.title = 'DONE';
</script>
